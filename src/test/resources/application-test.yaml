spring:
  datasource:
    url: jdbc:h2:mem:beton;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    # Migrations use MySQL-only SQL (uuid_to_bin, curdate()), Hibernate builds the schema instead
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long!!
beton:
  card-fee:
    percent: 1.5

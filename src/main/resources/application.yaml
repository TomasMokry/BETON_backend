spring:
  application:
    name: beton
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics